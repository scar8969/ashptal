[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashptal"
version = "1.0.0"
description = "Safety-guarded healthcare assistant chatbot powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout" }]
dependencies = ["google-generativeai>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ashptal = "ashptal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
